[project]
name = "pi-panel-compositor-mqtt"
version = "0.1.0"
description = "MQTT bridge and TUI for pi-panel-compositor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Async MQTT. Deliberately not raw paho-mqtt: its threaded loop_start()
    # runs callbacks on another OS thread, which would force call_from_thread
    # marshalling for every message inside Textual. aiomqtt wraps paho and
    # exposes `async for message in client.messages`, which runs as an ordinary
    # coroutine on the same asyncio loop Textual already drives.
    "aiomqtt>=2.5,<3",
    "textual>=8.2,<9",
]

[project.scripts]
pi-panel-bridge = "pi_panel_mqtt.bridge.__main__:main"
pi-panel-tui = "pi_panel_mqtt.tui.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_panel_mqtt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
